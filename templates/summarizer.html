<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  </head>
  <body data-page="summarizer">
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-icon">E</div>
          <div>
            <div class="eyebrow">Gemini AI Learning</div>

        <nav class="nav">

        <section class="section-block" id="summarizer">

            <div>

            <div id="summary-output" class="summary-box">Your summary will appear here.</div>
